
server.port=${PORT:8080}

# Configuración de MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/besalud}
spring.data.mongodb.auto-index-creation=true

# Configuración de Sesión
server.servlet.session.timeout=45m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=COOKIE

# JWT
app.jwt.secret=${JWT_SECRET:besalud-super-secret-key-min-256-bits-required-for-hmac}
app.jwt.expiration-ms=86400000

# Detalle de errores: solo para depuración local (ERROR_INCLUDE_MESSAGE=always, INCLUDE_STACKTRACE=always)
server.error.include-message=${ERROR_INCLUDE_MESSAGE:never}
server.error.include-stacktrace=${INCLUDE_STACKTRACE:never}
spring.thymeleaf.cache=true

server.forward-headers-strategy=NATIVE
# El proxy de Railway se conecta desde IPs públicas que cambian, así que se confía en cualquiera.
# Es seguro porque Railway reemplaza el X-Forwarded-For que mande el cliente por su IP real
# y el contenedor no es accesible sin pasar por ese proxy. Sin esto, el rate limit ve la IP del proxy.
server.tomcat.remoteip.internal-proxies=.*

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.google.scope=email,profile

# Asistente de síntomas (triage). Sin API key se usa solo el respaldo por palabras clave.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-flash-lite-latest,gemini-flash-latest}

# Correos (Brevo, API HTTP). Sin BREVO_API_KEY o MAIL_REMITENTE solo se registran en el log.
app.url=${APP_URL:http://localhost:8080}
app.correo.brevo-api-key=${BREVO_API_KEY:}
app.correo.remitente=${MAIL_REMITENTE:}
app.correo.nombre=BeSalud
