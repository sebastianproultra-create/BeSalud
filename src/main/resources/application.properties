
server.port=${PORT:8080}

# Configuración de MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/besalud}
spring.data.mongodb.auto-index-creation=true

# Configuración de Sesión
server.servlet.session.timeout=45m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=COOKIE

# JWT
app.jwt.secret=${JWT_SECRET:besalud-super-secret-key-min-256-bits-required-for-hmac}
app.jwt.expiration-ms=86400000

# Verbose errors for debugging
server.error.include-message=always
server.error.include-stacktrace=${INCLUDE_STACKTRACE:always}
spring.thymeleaf.cache=true

server.forward-headers-strategy=NATIVE
# Proxies de confianza: redes privadas IPv4 y la red interna IPv6 de Railway (fd00::/8).
# Sin la parte IPv6, Tomcat ve la IP del proxy en vez de la del cliente y el rate limit no funciona.
server.tomcat.remoteip.internal-proxies=10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[01])\\.\\d{1,3}\\.\\d{1,3}|100\\.(6[4-9]|[7-9]\\d|1[01]\\d|12[0-7])\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1|[fF][cCdD][0-9a-fA-F]{2}:.*

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.google.scope=email,profile
