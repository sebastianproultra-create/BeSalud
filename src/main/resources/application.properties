
server.port=${PORT:8080}

# Configuración de MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/besalud}
spring.data.mongodb.auto-index-creation=true

# Subida de archivos (foto del doctor: máximo 2 MB)
# 5 MB por los documentos que el paciente adjunta a su historial; la foto del médico se sigue limitando a 2 MB en el servicio
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Configuración de Sesión
server.servlet.session.timeout=45m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=COOKIE

# JWT
# Sin JWT_SECRET se usa una clave aleatoria (segura, pero las sesiones se pierden al reiniciar)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Detalle de errores: solo para depuración local (ERROR_INCLUDE_MESSAGE=always, INCLUDE_STACKTRACE=always)
server.error.include-message=${ERROR_INCLUDE_MESSAGE:never}
server.error.include-stacktrace=${INCLUDE_STACKTRACE:never}
spring.thymeleaf.cache=true

server.forward-headers-strategy=NATIVE
# El proxy de Railway se conecta desde IPs públicas que cambian, así que se confía en cualquiera.
# Es seguro porque Railway reemplaza el X-Forwarded-For que mande el cliente por su IP real
# y el contenedor no es accesible sin pasar por ese proxy. Sin esto, el rate limit ve la IP del proxy.
server.tomcat.remoteip.internal-proxies=.*

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.google.scope=email,profile

# Asistente de síntomas (triage). Sin API key se usa solo el respaldo por palabras clave.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-flash-lite-latest,gemini-flash-latest}

# Correos (Brevo, API HTTP). Sin BREVO_API_KEY o MAIL_REMITENTE solo se registran en el log.
app.url=${APP_URL:http://localhost:8080}
app.whatsapp.token=${WHATSAPP_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.bot-secret=${WHATSAPP_BOT_SECRET:}
app.correo.brevo-api-key=${BREVO_API_KEY:}
app.correo.remitente=${MAIL_REMITENTE:}
app.correo.nombre=BeSalud

# API predictiva en Python. En Railway: variable API_PYTHON_URL con el dominio público del servicio.
api.python.url=${API_PYTHON_URL:http://localhost:8000}

# Abono previo con Wompi. Sin llaves se usa una pasarela simulada (solo demostración, no cobra).
# Llaves de prueba (pub_test_/prv_test_) en el panel de comercios de Wompi > Desarrolladores.
app.pagos.wompi.llave-publica=${WOMPI_PUBLIC_KEY:}
app.pagos.wompi.llave-privada=${WOMPI_PRIVATE_KEY:}
app.pagos.wompi.secreto-integridad=${WOMPI_INTEGRITY_SECRET:}
app.pagos.wompi.secreto-eventos=${WOMPI_EVENTS_SECRET:}
app.pagos.minutos-para-pagar=15
# Pasarela de pruebas cuando no hay llaves de Wompi. En un despliegue real se apaga con PAGOS_SIMULADOS=false:
# así nadie confirma una cita sin pagar (las reservas en línea quedan pausadas hasta poner las llaves).
app.pagos.simulados=${PAGOS_SIMULADOS:true}
# NIT con el que se muestra el comercio en el comprobante (vacío = no se muestra)
app.comercio.nit=${COMERCIO_NIT:}
