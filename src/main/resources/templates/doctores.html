<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctores - BeHealth Citas Médicas</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
    <h1>BeHealth</h1>
    <p>Sistema de Gestión de Citas Médicas</p>
</header>

<nav>
    <a th:href="@{/doctores}">Doctores</a>
    <a th:href="@{/pacientes}">Pacientes</a>
    <a th:href="@{/citas}">Citas</a>
    <form th:action="@{/logout}" method="post" style="display:inline;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-link" style="color: white; padding: 0; margin-left: 20px;">Cerrar Sesión</button>
    </form>
</nav>

<div class="container">
    <div class="card">
        <h2>Doctores Registrados</h2>
        
        <form th:action="@{/doctores}" method="get" class="inline-form">
            <input type="text" name="especialidad" th:value="${filtroEspecialidad}" placeholder="Filtrar por especialidad"/>
            <button type="submit" class="btn btn-primary">Buscar</button>
        </form>

        <table th:if="${!doctores.isEmpty()}">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Especialidad</th>
                    <th>Correo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="doctor : ${doctores}">
                    <td th:text="${doctor.nombre}"></td>
                    <td th:text="${doctor.apellido}"></td>
                    <td><span class="badge" th:text="${doctor.especialidad}"></span></td>
                    <td th:text="${doctor.email}"></td>
                    <td>
                        <a th:href="@{/doctores/{id}/horarios(id=${doctor.id})}" class="btn btn-primary">Ver Horarios</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <div th:if="${doctores.isEmpty()}" class="alert alert-info">
            No hay doctores registrados
        </div>
    </div>

    <div class="card">
        <h2>Registrar Doctor</h2>
        <form th:action="@{/doctores/guardar}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            
            <label>Nombre:</label>
            <input type="text" name="nombre" required/>

            <label>Apellido:</label>
            <input type="text" name="apellido" required/>

            <label>Teléfono:</label>
            <input type="text" name="telefono"/>

            <label>Identificación:</label>
            <input type="text" name="identificacion"/>

            <label>Email:</label>
            <input type="email" name="email" required/>

            <label>Contraseña:</label>
            <input type="password" name="password" required/>

            <label>Especialidad:</label>
            <input type="text" name="especialidad" required/>

            <button type="submit" class="btn btn-success">Guardar</button>
        </form>
    </div>
</div>

<footer>
    <p>&copy; 2026 BeHealth - Sistema de Citas Médicas. Todos los derechos reservados.</p>
</footer>
</body>
</html>
