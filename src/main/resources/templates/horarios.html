<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Horarios de Atención - BeSalud</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/horarios.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header-brand}"></header>
<nav th:replace="~{fragments/layout :: nav-admin}"></nav>

<div class="container">
    <div class="card">
        <h2>Horarios de Atención</h2>
        <p style="margin-bottom: 20px; font-size: 16px; color: var(--primary-color); font-weight: 600;">
            <span th:text="${doctor.nombre} + ' ' + ${doctor.apellido}"></span>
            <span class="badge" th:text="${doctor.especialidad}"></span>
        </p>

        <table th:if="${!horarios.isEmpty()}">
            <thead>
                <tr>
                    <th>Día</th>
                    <th>Inicio</th>
                    <th>Fin</th>
                    <th>Duración (min)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="h : ${horarios}">
                    <td th:text="${h.diaSemana.name() == 'MONDAY' ? 'Lunes' :
                                   h.diaSemana.name() == 'TUESDAY' ? 'Martes' :
                                   h.diaSemana.name() == 'WEDNESDAY' ? 'Miércoles' :
                                   h.diaSemana.name() == 'THURSDAY' ? 'Jueves' :
                                   h.diaSemana.name() == 'FRIDAY' ? 'Viernes' :
                                   h.diaSemana.name() == 'SATURDAY' ? 'Sábado' : 'Domingo'}"></td>
                    <td th:text="${h.horaInicio}"></td>
                    <td th:text="${h.horaFin}"></td>
                    <td th:text="${h.duracionCitaMinutos}"></td>
                </tr>
            </tbody>
        </table>

        <div th:if="${horarios.isEmpty()}" class="alert alert-info">
            Este doctor aún no tiene horarios registrados
        </div>
    </div>

    <div class="card">
        <a th:href="@{/admin}" class="btn btn-link">← Volver al Panel</a>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
