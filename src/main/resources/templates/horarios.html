<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Horarios de Atención - BeSalud</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/horarios.css}">
</head>
<body>
<header>
    <div class="header-brand">
        <h1>BeSalud</h1>
        <p>Sistema de Gestión de Citas Médicas</p>
    </div>
</header>

<nav>
    <a th:href="@{/doctores}">Doctores</a>
    <a th:href="@{/pacientes}">Pacientes</a>
    <a th:href="@{/citas}">Citas</a>
    <form th:action="@{/logout}" method="post" style="display:inline;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-link" style="color: white; padding: 0; margin-left: 20px;">Cerrar Sesión</button>
    </form>
</nav>

<div class="container">
    <div class="card">
        <h2>Horarios de Atención</h2>
        <p style="margin-bottom: 20px; font-size: 16px; color: var(--primary-color); font-weight: 600;">
            <span th:text="${doctor.nombre} + ' ' + ${doctor.apellido}"></span>
            <span class="badge" th:text="${doctor.especialidad}"></span>
        </p>

        <table th:if="${!horarios.isEmpty()}">
            <thead>
                <tr>
                    <th>Día</th>
                    <th>Inicio</th>
                    <th>Fin</th>
                    <th>Duración (min)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="h : ${horarios}">
                    <td th:text="${h.diaSemana}"></td>
                    <td th:text="${h.horaInicio}"></td>
                    <td th:text="${h.horaFin}"></td>
                    <td th:text="${h.duracionCitaMinutos}"></td>
                </tr>
            </tbody>
        </table>

        <div th:if="${horarios.isEmpty()}" class="alert alert-info">
            Este doctor aún no tiene horarios registrados
        </div>
    </div>

    <div class="card">
        <a th:href="@{/admin}" class="btn btn-link">← Volver al Panel</a>
    </div>
</div>

<footer>
    <p>&copy; 2026 BeSalud - Sistema de Citas Médicas. Todos los derechos reservados.</p>
</footer>
</body>
</html>
