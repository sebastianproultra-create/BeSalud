<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios de Atención - BeSalud</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: shell-admin('doctores')}"></header>

<main class="container">
    <section class="page-header" aria-labelledby="page-title">
        <div>
            <p class="page-eyebrow">Horarios de atención</p>
            <h1 id="page-title" class="page-title" th:text="'Dr. ' + ${doctor.nombre} + ' ' + ${doctor.apellido}">Doctor</h1>
            <p class="page-subtitle" th:text="${doctor.especialidad}">Especialidad</p>
        </div>
        <a th:href="@{/doctores}" class="btn btn-secondary">← Volver a doctores</a>
    </section>

    <div class="card table-card">
        <div class="table-scroll" th:if="${!horarios.isEmpty()}">
        <table>
            <thead>
                <tr>
                    <th scope="col">Día</th>
                    <th scope="col">Inicio</th>
                    <th scope="col">Fin</th>
                    <th scope="col">Duración (min)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="h : ${horarios}">
                    <td th:text="${h.diaSemana.name() == 'MONDAY' ? 'Lunes' :
                                   h.diaSemana.name() == 'TUESDAY' ? 'Martes' :
                                   h.diaSemana.name() == 'WEDNESDAY' ? 'Miércoles' :
                                   h.diaSemana.name() == 'THURSDAY' ? 'Jueves' :
                                   h.diaSemana.name() == 'FRIDAY' ? 'Viernes' :
                                   h.diaSemana.name() == 'SATURDAY' ? 'Sábado' : 'Domingo'}"></td>
                    <td th:text="${h.horaInicio}"></td>
                    <td th:text="${h.horaFin}"></td>
                    <td th:text="${h.duracionCitaMinutos}"></td>
                </tr>
            </tbody>
        </table>
        </div>
        <p th:if="${horarios.isEmpty()}" class="empty-note">Este doctor aún no tiene horarios registrados.</p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
