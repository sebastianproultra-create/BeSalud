<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios de atención - BeSalud</title>
    <link rel="stylesheet" th:href="@{/css/base/global.css}">
    <link rel="stylesheet" th:href="@{/css/base/panel.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body class="doc-page admin-page">
<header th:replace="~{fragments/layout :: shell-admin('doctores')}"></header>

<main class="doc-main">
    <section class="doc-hero" aria-labelledby="page-title">
        <div class="doc-hero-glow doc-hero-glow--a" aria-hidden="true"></div>
        <div class="doc-hero-glow doc-hero-glow--b" aria-hidden="true"></div>
        <div class="doc-hero-top">
            <div class="doc-hero-text">
                <p class="doc-eyebrow"><span class="doc-pulse" aria-hidden="true"></span>Horarios de atención</p>
                <h1 id="page-title" class="doc-hero-title" th:text="'Dr. ' + ${doctor.nombre} + ' ' + ${doctor.apellido}">Doctor</h1>
                <p class="doc-hero-sub"><span th:text="${doctor.especialidad}">Especialidad</span></p>
            </div>
            <div class="doc-hero-actions">
                <a th:href="@{/doctores}" class="doc-btn doc-btn--glass"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>Volver a doctores</a>
            </div>
        </div>
    </section>

    <div class="doc-card table-card">
        <div class="table-scroll" th:if="${!horarios.isEmpty()}">
        <table>
            <thead>
                <tr>
                    <th scope="col">Día</th>
                    <th scope="col">Inicio</th>
                    <th scope="col">Fin</th>
                    <th scope="col">Duración (min)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="h : ${horarios}">
                    <td th:text="${h.diaSemana.name() == 'MONDAY' ? 'Lunes' :
                                   h.diaSemana.name() == 'TUESDAY' ? 'Martes' :
                                   h.diaSemana.name() == 'WEDNESDAY' ? 'Miércoles' :
                                   h.diaSemana.name() == 'THURSDAY' ? 'Jueves' :
                                   h.diaSemana.name() == 'FRIDAY' ? 'Viernes' :
                                   h.diaSemana.name() == 'SATURDAY' ? 'Sábado' : 'Domingo'}"></td>
                    <td th:text="${h.horaInicio}"></td>
                    <td th:text="${h.horaFin}"></td>
                    <td th:text="${h.duracionCitaMinutos}"></td>
                </tr>
            </tbody>
        </table>
        </div>
        <p th:if="${horarios.isEmpty()}" class="empty-note">Este doctor aún no tiene horarios registrados.</p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: app-footer}"></footer>
</body>
</html>
