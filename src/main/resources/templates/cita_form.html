<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Agendar Cita - BeSalud</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/cita_form.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header-brand}"></header>
<nav th:replace="~{fragments/layout :: nav-admin}"></nav>

<div class="container">
    <div class="card" style="max-width: 600px; margin: 30px auto;">
        <h2>Agendar Nueva Cita</h2>
        
        <form th:action="@{/citas/guardar}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            
            <label for="doctorId">Doctor:</label>
            <select id="doctorId" name="doctorId" required class="styled-select">
                <option value="">Seleccione un doctor</option>
                <option th:each="d : ${doctores}" th:value="${d.id}" 
                        th:text="${d.nombre} + ' ' + ${d.apellido} + ' (' + ${d.especialidad} + ')'"/>
            </select>

            <label for="pacienteId">Paciente:</label>
            <select id="pacienteId" name="pacienteId" required class="styled-select">
                <option value="">Seleccione un paciente</option>
                <option th:each="p : ${pacientes}" th:value="${p.id}" 
                        th:text="${p.nombre} + ' ' + ${p.apellido}"/>
            </select>

            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" name="fecha" required/>

            <label for="hora">Hora:</label>
            <input type="time" id="hora" name="hora" required/>

            <label for="motivo">Motivo de la Consulta:</label>
            <textarea id="motivo" name="motivo" rows="4" placeholder="Describe el motivo de la cita" required></textarea>

            <button type="submit" class="btn btn-success">Agendar Cita</button>
            <a th:href="@{/citas}" class="btn btn-link" style="margin-left: 10px;">Cancelar</a>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/custom-select.js}"></script>
<script th:src="@{/js/form-submit.js}"></script>
</body>
</html>
