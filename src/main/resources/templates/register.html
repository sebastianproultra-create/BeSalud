<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registro - BeHealth Citas Médicas</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
<header>
    <h1>BeHealth</h1>
    <p>Sistema de Gestión de Citas Médicas</p>
</header>

<div class="container">
    <div class="card" style="max-width: 600px; margin: 30px auto;">
        <h2>Registro de Usuario</h2>

        <form th:action="@{/register/save}" th:object="${user}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            
            <label for="role">Rol:</label>
            <select id="role" th:field="*{role}" required onchange="toggleDoctorFields()">
                <option value="">Selecciona un rol</option>
                <option value="PACIENTE">Paciente</option>
                <option value="DOCTOR">Doctor</option>
            </select>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" th:field="*{nombre}" required/>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" th:field="*{apellido}" required/>

            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" th:field="*{telefono}"/>

            <label for="identificacion">Identificación:</label>
            <input type="text" id="identificacion" th:field="*{identificacion}"/>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" th:field="*{email}" required/>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" th:field="*{password}" required/>

            <div id="doctorFields" style="display: none;">
                <label for="especialidad">Especialidad:</label>
                <select id="especialidad" th:field="*{especialidad}" required>
                    <optgroup label="Atención Integral y Primaria">
                        <option value="Geriatría">Geriatría</option>
                        <option value="Medicina Familiar">Medicina Familiar</option>
                        <option value="Medicina General">Medicina General</option>
                        <option value="Medicina Interna">Medicina Interna</option>
                        <option value="Pediatría">Pediatría</option>
                    </optgroup>
                    <optgroup label="Especialidades Médicas (Clínicas)">
                        <option value="Alergología e Inmunología">Alergología e Inmunología</option>
                        <option value="Cardiología">Cardiología</option>
                        <option value="Dermatología">Dermatología</option>
                        <option value="Endocrinología y Metabolismo">Endocrinología y Metabolismo</option>
                        <option value="Gastroenterología">Gastroenterología</option>
                        <option value="Ginecología y Obstetricia">Ginecología y Obstetricia</option>
                        <option value="Hematología">Hematología</option>
                        <option value="Infectología">Infectología</option>
                        <option value="Nefrología">Nefrología</option>
                        <option value="Neumología">Neumología</option>
                        <option value="Neurología">Neurología</option>
                        <option value="Nutrición y Dietética">Nutrición y Dietética</option>
                        <option value="Oftalmología">Oftalmología</option>
                        <option value="Oncología Médica">Oncología Médica</option>
                        <option value="Otorrinolaringología">Otorrinolaringología</option>
                        <option value="Reumatología">Reumatología</option>
                        <option value="Urología">Urología</option>
                    </optgroup>
                    <optgroup label="Especialidades Quirúrgicas">
                        <option value="Cirugía Cardiovascular">Cirugía Cardiovascular</option>
                        <option value="Cirugía General">Cirugía General</option>
                        <option value="Cirugía Maxilofacial">Cirugía Maxilofacial</option>
                        <option value="Cirugía Plástica y Estética">Cirugía Plástica y Estética</option>
                        <option value="Cirugía Vascular">Cirugía Vascular</option>
                        <option value="Neurocirugía">Neurocirugía</option>
                        <option value="Ortopedia y Traumatología">Ortopedia y Traumatología</option>
                    </optgroup>
                    <optgroup label="Salud Mental y Rehabilitación">
                        <option value="Fisiatría (Medicina Física)">Fisiatría (Medicina Física)</option>
                        <option value="Psicología Clínica">Psicología Clínica</option>
                        <option value="Psiquiatría">Psiquiatría</option>
                        <option value="Terapia Ocupacional">Terapia Ocupacional</option>
                    </optgroup>
                    <optgroup label="Otras Especialidades">
                        <option value="Medicina del Deporte">Medicina del Deporte</option>
                        <option value="Medicina del Dolor y Cuidados Paliativos">Medicina del Dolor y Cuidados Paliativos</option>
                        <option value="Medicina Laboral">Medicina Laboral</option>
                        <option value="Toxicología">Toxicología</option>
                    </optgroup>
                </select>

                <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}"/>

                <label for="foto">Foto:</label>
                <input type="file" accept="image/*" id="foto" name="fotoFile"/>

                <label for="biografia">Biografía:</label>
                <textarea id="biografia" th:field="*{biografia}" rows="3"></textarea>
            </div>

            <button type="submit">Registrarse</button>
        </form>

        <div th:if="${error}" class="alert alert-error">
            <p th:text="${error}"></p>
        </div>

        <p style="text-align: center; margin-top: 20px;">
            <a th:href="@{/login}">¿Ya tienes cuenta? Inicia sesión aquí</a>
        </p>
    </div>
</div>

<script>
function toggleDoctorFields() {
    const role = document.getElementById('role').value;
    const doctorFields = document.getElementById('doctorFields');
    if (role === 'DOCTOR') {
        doctorFields.style.display = 'block';
    } else {
        doctorFields.style.display = 'none';
    }
}
</script>

<footer>
    <p>&copy; 2026 BeHealth - Sistema de Citas Médicas. Todos los derechos reservados.</p>
</footer>
</body>
</html>
