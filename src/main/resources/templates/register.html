<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - BeSalud</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header-brand}"></header>

<div class="container">
    <div class="card card-center">
        <h2>Registro de usuario</h2>

        <form th:action="@{/register/save}" th:object="${user}" method="post" enctype="multipart/form-data">
            <label for="role">Rol:</label>
            <select id="role" th:field="*{role}" required onchange="toggleDoctorFields()" class="styled-select">
                <option value="">Selecciona un rol</option>
                <option value="PACIENTE">Paciente</option>
                <option value="DOCTOR">Doctor</option>
            </select>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" th:field="*{nombre}" required/>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" th:field="*{apellido}" required/>

            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" th:field="*{telefono}" required maxlength="10" pattern="3[0-9]{9}" title="10 dígitos, debe empezar por 3" placeholder="3001234567" inputmode="numeric"/>
            <span id="telefono-hint" class="field-hint"></span>

            <label for="identificacion">Identificación:</label>
            <input type="text" id="identificacion" th:field="*{identificacion}" required maxlength="10" pattern="[0-9]{6,10}" title="Entre 6 y 10 dígitos, solo números" inputmode="numeric"/>
            <span id="identificacion-hint" class="field-hint"></span>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" th:field="*{email}" required/>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" th:field="*{password}" required minlength="8" maxlength="72"
                   title="Mínimo 8 caracteres, con al menos una letra y un número" autocomplete="new-password"/>

            <div id="doctorFields" style="display: none;">
                <label for="especialidad">Especialidad:</label>
                <select id="especialidad" th:field="*{especialidad}" class="styled-select">
                    <option value="">Selecciona una especialidad</option>
                    <th:block th:replace="~{fragments/layout :: especialidadOpciones}"></th:block>
                </select>

                <label for="fechaNacimiento">Fecha de nacimiento:</label>
                <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}"/>

                <label for="foto">Foto:</label>
                <input type="file" accept="image/*" id="foto" name="fotoFile"/>

                <label for="biografia">Biografía:</label>
                <textarea id="biografia" th:field="*{biografia}" rows="3"></textarea>
            </div>

            <label class="check-privacidad">
                <input type="checkbox" name="aceptaPrivacidad" required/>
                <span>Acepto la <a th:href="@{/privacidad}" target="_blank" rel="noopener">política de privacidad</a> y el tratamiento de mis datos.</span>
            </label>

            <div th:if="${error}" class="alert alert-error">
                <p th:text="${error}"></p>
            </div>

            <button type="submit">Registrarse</button>
        </form>

        <p class="text-center mt-20">
            <a th:href="@{/login}">¿Ya tienes cuenta? Inicia sesión aquí</a>
        </p>
    </div>
</div>

<script>
function toggleDoctorFields() {
    const role = document.getElementById('role').value;
    const doctorFields = document.getElementById('doctorFields');
    doctorFields.style.display = role === 'DOCTOR' ? 'block' : 'none';
    document.getElementById('especialidad').required = role === 'DOCTOR';
}

toggleDoctorFields();

const telefonoInput = document.getElementById('telefono');
const telefonoHint = document.getElementById('telefono-hint');

telefonoInput.addEventListener('keypress', function (e) {
    if (!/\d/.test(e.key)) e.preventDefault();
});

telefonoInput.addEventListener('input', function () {
    this.value = this.value.replace(/\D/g, '').slice(0, 10);
    const val = this.value;
    if (val.length === 0) {
        this.className = '';
        telefonoHint.textContent = '';
    } else if (!val.startsWith('3')) {
        this.classList.add('input-error');
        this.classList.remove('input-success');
        telefonoHint.textContent = 'Debe empezar por 3';
        telefonoHint.className = 'field-hint error';
    } else {
        this.classList.add('input-success');
        this.classList.remove('input-error');
        telefonoHint.textContent = '';
    }
});

const identificacionInput = document.getElementById('identificacion');

identificacionInput.addEventListener('keypress', function (e) {
    if (!/\d/.test(e.key)) e.preventDefault();
});

identificacionInput.addEventListener('input', function () {
    this.value = this.value.replace(/\D/g, '').slice(0, 10);
    const val = this.value;
    if (val.length === 0) {
        this.className = '';
    } else {
        this.classList.add('input-success');
        this.classList.remove('input-error');
    }
});
</script>
<script th:src="@{/js/custom-select.js}"></script>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/form-submit.js}"></script>
</body>
</html>
