<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    
<head>
    <title>Login - BeSalud</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header-brand}"></header>

<div class="container">
    <div class="card" style="max-width: 500px; margin: 50px auto;">
        <h2>Iniciar Sesión</h2>
        
        <form th:action="@{/login}" method="post">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required/>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required/>

            <button type="submit" class="login-submit">Ingresar</button>
        </form>

        <div class="oauth-divider"><span>o</span></div>

        <a th:href="@{/oauth2/authorization/google}" class="btn-google-login">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 48 48" style="flex-shrink:0;">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                <path fill="none" d="M0 0h48v48H0z"/>
            </svg>
            Continuar con Google
        </a>

        <p class="login-register-link">
            <a th:href="@{/register}">¿No tienes cuenta? Regístrate aquí</a>
        </p>

        <!-- Mostrar éxito de registro -->
        <div th:if="${param.registerSuccess}" class="alert alert-success">
            Registro exitoso. Ya puedes iniciar sesión.
        </div>

        <!-- Mostrar error si existe -->
        <div th:if="${param.error}" class="alert alert-error">
            Usuario o contraseña incorrecta
        </div>

        <!-- Mensaje de sesión expirada -->
        <div th:if="${param.sessionExpired}" class="alert alert-error">
            Tu sesión ha expirado. Por favor, inicia sesión de nuevo.
        </div>

        <!-- Mensaje de logout exitoso -->
        <div th:if="${param.logout}" class="alert alert-success">
            Sesión cerrada correctamente
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/form-submit.js}"></script>
</body>
</html>
