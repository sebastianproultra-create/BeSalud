<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    
<head>
    <title>Login - BeHealth Citas Médicas</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
    <h1>BeHealth</h1>
    <p>Sistema de Gestión de Citas Médicas</p>
</header>

<div class="container">
    <div class="card" style="max-width: 500px; margin: 50px auto;">
        <h2>Iniciar Sesión</h2>
        
        <form th:action="@{/login}" method="post">
            <label for="username">Email:</label>
            <input type="email" id="username" name="username" required/>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required/>

            <!-- Token CSRF -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <button type="submit">Ingresar</button>
        </form>

        <p style="text-align: center; margin-top: 20px;">
            <a th:href="@{/register}">¿No tienes cuenta? Regístrate aquí</a>
        </p>

        <!-- Mostrar éxito de registro -->
        <div th:if="${param.registerSuccess}" class="alert alert-success">
            Registro exitoso. Ya puedes iniciar sesión.
        </div>

        <!-- Mostrar error si existe -->
        <div th:if="${param.error}" class="alert alert-error">
            Usuario o contraseña incorrecta
        </div>

        <!-- Mensaje de logout exitoso -->
        <div th:if="${param.logout}" class="alert alert-success">
            Sesión cerrada correctamente
        </div>
    </div>
</div>

<footer>
    <p>&copy; 2026 BeHealth - Sistema de Citas Médicas. Todos los derechos reservados.</p>
</footer>
</body>
</html>
