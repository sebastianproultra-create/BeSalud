<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    
<head>
    <title>Login - BeSalud</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header-brand}"></header>

<div class="container">
    <div class="card" style="max-width: 500px; margin: 50px auto;">
        <h2>Iniciar Sesión</h2>
        
        <form th:action="@{/login}" method="post">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required/>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required/>

            <button type="submit">Ingresar</button>
        </form>

        <div style="margin: 20px 0;">
            <a th:href="@{/oauth2/authorization/google}" class="btn btn-secondary"
               style="display:inline-block; text-decoration:none;">
                Iniciar sesión con Google
            </a>
        </div>

        <p style="text-align: center; margin-top: 20px;">
            <a th:href="@{/register}">¿No tienes cuenta? Regístrate aquí</a>
        </p>

        <!-- Mostrar éxito de registro -->
        <div th:if="${param.registerSuccess}" class="alert alert-success">
            Registro exitoso. Ya puedes iniciar sesión.
        </div>

        <!-- Mostrar error si existe -->
        <div th:if="${param.error}" class="alert alert-error">
            Usuario o contraseña incorrecta
        </div>

        <!-- Mensaje de sesión expirada -->
        <div th:if="${param.sessionExpired}" class="alert alert-error">
            Tu sesión ha expirado. Por favor, inicia sesión de nuevo.
        </div>

        <!-- Mensaje de logout exitoso -->
        <div th:if="${param.logout}" class="alert alert-success">
            Sesión cerrada correctamente
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/form-submit.js}"></script>
</body>
</html>
