<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegir rol - BeSalud</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header-brand}"></header>

<div class="container">
    <div class="card card-center">
        <h2>Completa tu registro</h2>
        <p>Tu cuenta de Google: <strong th:text="${email}"></strong></p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/elegir-rol}" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>

            <label for="role">Rol:</label>
            <select id="role" name="role" required onchange="toggleDoctorFields()" class="styled-select">
                <option value="">Selecciona un rol</option>
                <option value="PACIENTE">Paciente</option>
                <option value="DOCTOR">Doctor</option>
            </select>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" th:value="${nombre}" required/>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" th:value="${apellido}" required/>

            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" name="telefono" maxlength="10" pattern="3[0-9]{9}" title="10 dígitos, debe empezar por 3" placeholder="3001234567" inputmode="numeric" required/>

            <label for="identificacion">Identificación:</label>
            <input type="text" id="identificacion" name="identificacion" maxlength="10" pattern="[0-9]{6,10}" title="Entre 6 y 10 dígitos, solo números" inputmode="numeric" required/>

            <div id="doctor-fields" style="display:none;">
                <label for="especialidad">Especialidad:</label>
                <select id="especialidad" name="especialidad" class="styled-select">
                    <option value="">Selecciona una especialidad</option>
                    <th:block th:replace="~{fragments/layout :: especialidadOpciones}"></th:block>
                </select>

                <label for="fechaNacimiento">Fecha de nacimiento:</label>
                <input type="date" id="fechaNacimiento" name="fechaNacimiento"/>

                <label for="biografia">Biografía (opcional):</label>
                <textarea id="biografia" name="biografia" rows="3" maxlength="500"></textarea>
            </div>

            <label class="check-privacidad">
                <input type="checkbox" name="aceptaPrivacidad" required/>
                <span>Acepto la <a th:href="@{/privacidad}" target="_blank" rel="noopener">política de privacidad</a> y el tratamiento de mis datos.</span>
            </label>

            <button type="submit">Continuar</button>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script>
function toggleDoctorFields() {
    const role = document.getElementById('role').value;
    const doctorFields = document.getElementById('doctor-fields');
    doctorFields.style.display = role === 'DOCTOR' ? 'block' : 'none';
    const especialidad = document.getElementById('especialidad');
    const fechaNac = document.getElementById('fechaNacimiento');
    especialidad.required = role === 'DOCTOR';
    fechaNac.required = role === 'DOCTOR';
}
</script>
<script th:src="@{/js/custom-select.js}"></script>
</body>
</html>
