<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Pacientes - BeSalud</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/pacientes.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header-brand}"></header>
<nav th:replace="~{fragments/layout :: nav-admin}"></nav>

<div class="container">
    <div class="card">
        <h2>Pacientes Registrados</h2>
        
        <table th:if="${!pacientes.isEmpty()}">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${pacientes}">
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.apellido}"></td>
                    <td th:text="${p.email}"></td>
                    <td th:text="${p.telefono}"></td>
                </tr>
            </tbody>
        </table>

        <div th:if="${pacientes.isEmpty()}" class="alert alert-info">
            No hay pacientes registrados
        </div>
    </div>

    <div class="card">
        <h2>Registrar Paciente</h2>
        <form th:action="@{/pacientes/guardar}" method="post">

            
            <label>Nombre:</label>
            <input type="text" name="nombre" required/>

            <label>Apellido:</label>
            <input type="text" name="apellido" required/>

            <label>Teléfono:</label>
            <input type="text" name="telefono"/>

            <label>Identificación:</label>
            <input type="text" name="identificacion"/>

            <label>Email:</label>
            <input type="email" name="email" required autocomplete="off"/>

            <label>Contraseña:</label>
            <input type="password" name="password" required autocomplete="new-password"/>

            <button type="submit" class="btn btn-success">Guardar</button>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/form-submit.js}"></script>
</body>
</html>
