<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes - BeSalud</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: shell-admin('pacientes')}"></header>

<main class="container">
    <section class="page-header" aria-labelledby="page-title">
        <div>
            <p class="page-eyebrow">Directorio</p>
            <h1 id="page-title" class="page-title">Pacientes registrados</h1>
        </div>
        <a href="#registrar" class="btn btn-primary">+ Registrar paciente</a>
    </section>

    <div class="card table-card">
        <div class="table-scroll" th:if="${!pacientes.isEmpty()}">
        <table>
            <thead>
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Apellido</th>
                    <th scope="col">Email</th>
                    <th scope="col">Teléfono</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${pacientes.content}">
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.apellido}"></td>
                    <td th:text="${p.email}"></td>
                    <td th:text="${p.telefono}"></td>
                </tr>
            </tbody>
        </table>
        </div>
        <p th:if="${pacientes.isEmpty()}" class="empty-note">No hay pacientes registrados.</p>
        <nav th:replace="~{fragments/layout :: paginationQ(${pacientes}, '/pacientes', ${queryPacientes}, 'page')}"></nav>
    </div>

    <section id="registrar" class="card" aria-labelledby="register-title">
        <h2 id="register-title">Registrar paciente</h2>
      <div th:if="${error}" class="alert alert-error" role="alert" data-scroll-error="true" th:text="${error}"></div>
        <form th:action="@{/pacientes/guardar}" method="post" class="card-form">
                <div class="form-grid">
            <div class="form-field">
                <label for="nombre">Nombre *</label>
                <input id="nombre" type="text" name="nombre" required minlength="2" maxlength="50" data-validar="nombre" data-etiqueta="nombre" autocomplete="given-name" th:value="${paciente.nombre}"/>
            </div>
            <div class="form-field">
                <label for="apellido">Apellido *</label>
                <input id="apellido" type="text" name="apellido" required minlength="2" maxlength="50" data-validar="nombre" data-etiqueta="apellido" autocomplete="family-name" th:value="${paciente.apellido}"/>
            </div>
            <div class="form-field">
                <label for="telefono">Teléfono *</label>
                <input id="telefono" type="tel" name="telefono" required inputmode="numeric" pattern="3[0-9]{9}" maxlength="10" placeholder="3001234567" title="10 dígitos, debe empezar por 3" data-validar="telefono" autocomplete="tel" th:value="${paciente.telefono}"/>
            </div>
            <div class="form-field">
                <label for="identificacion">Identificación *</label>
                <input id="identificacion" type="text" name="identificacion" required inputmode="numeric" pattern="[0-9]{6,10}" maxlength="10" title="Entre 6 y 10 dígitos, solo números" data-validar="identificacion" th:value="${paciente.identificacion}"/>
            </div>
            <div class="form-field">
                <label for="email">Email *</label>
                <input id="email" type="email" name="email" required maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false" data-validar="email" th:value="${paciente.email}"/>
            </div>
            <div class="form-field">
                <label for="password">Contraseña *</label>
                <input id="password" type="password" name="password" required minlength="8" maxlength="72" data-validar="password" autocomplete="new-password"
                    title="Mínimo 8 caracteres, con al menos una letra y un número"/>
            </div>
        </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-success">Guardar paciente</button>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/validaciones.js}"></script>
<script th:src="@{/js/form-submit.js}"></script>
</body>
</html>
