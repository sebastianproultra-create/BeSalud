<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Catálogo de Doctores - BeHealth</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/paciente_landing.css}">
</head>
<body>
<header>
    <h1>BeHealth</h1>
    <p>Encuentra tu Doctor Ideal</p>
    <nav>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-secondary">Cerrar Sesión</button>
        </form>
    </nav>
</header>

<div class="container">
    <div class="filter-section">
        <h2>Filtrar Doctores</h2>
        <form th:action="@{/pacientes/landing}" method="get">
            <label for="especialidad">Especialidad:</label>
            <select id="especialidad" name="especialidad">
                <option value="">Todas las especialidades</option>
                <option th:each="esp : ${especialidades}" th:value="${esp}" th:text="${esp}"></option>
            </select>
            <button type="submit" class="btn btn-primary">Filtrar</button>
        </form>
    </div>

    <div class="doctors-grid">
        <div th:each="doctor : ${doctores}" class="doctor-card">
            <div class="doctor-photo">
                <img th:src="${doctor.foto != null ? doctor.foto : '/images/default-avatar.jpg'}" alt="Foto del doctor" onerror="this.src='/images/default-avatar.jpg'">
            </div>
            <div class="doctor-info">
                <h3 th:text="${doctor.nombre + ' ' + doctor.apellido}"></h3>
                <p class="specialty" th:text="${doctor.especialidad}"></p>
                <p class="bio" th:text="${doctor.biografia != null ? doctor.biografia : 'Sin biografía disponible'}"></p>
                <a th:href="@{/citas/nueva(doctorId=${doctor.id})}" class="btn btn-primary">Agendar Cita</a>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(doctores)}" class="no-doctors">
        <p>No se encontraron doctores con los criterios seleccionados.</p>
    </div>
</div>

<footer>
    <p>&copy; 2026 BeHealth - Sistema de Citas Médicas. Todos los derechos reservados.</p>
</footer>
</body>
</html>
