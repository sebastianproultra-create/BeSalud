
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    
<head>
    <title>Gestión de Proyectos</title>
</head>
<body>

    <p>
    Usuario autenticado:
    <span sec:authentication="name"></span>
</p>

<br>

<h2>Lista de Proyectos</h2>

<table border="1">
    <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Fecha Inicio</th>
        <th>Tareas</th>
        <th>Agregar Tarea</th>
        <th>Acciones</th>
    </tr>

    <!-- Recorremos la lista de proyectos -->
    <tr th:each="p : ${proyectos}">
        <td th:text="${p.nombre}"></td>
        <td th:text="${p.descripcion}"></td>
        <td th:text="${p.fechaInicio}"></td>
        <td>
            <!-- Mostramos las tareas anidadas del proyecto (documento MongoDB) -->
            <ul th:if="${p.tareas != null and !p.tareas.isEmpty()}">
                <li th:each="t : ${p.tareas}">
                    <strong th:text="${t.titulo}"></strong>
                    - <span th:text="${t.estado}"></span>
                </li>
            </ul>
            <span th:if="${p.tareas == null or p.tareas.isEmpty()}">Sin tareas</span>
        </td>
        <td>
            <!-- Formulario para agregar tarea a este proyecto -->
            <div sec:authorize="hasAnyRole('ADMIN','COLABORADOR')">
                <form th:action="@{/proyectos/{id}/tareas(id=${p.id})}" method="post" style="display:flex; gap:4px;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="text" name="titulo" placeholder="Tarea" required size="12" />
                    <select name="estado">
                        <option value="pendiente">Pendiente</option>
                        <option value="en progreso">En progreso</option>
                        <option value="completada">Completada</option>
                    </select>
                    <button type="submit">+</button>
                </form>
            </div>
        </td>
        <td>
            <div sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/proyectos/eliminar/{id}(id=${p.id})}">Eliminar</a></div>
        </td>
    </tr>
</table>



<!-- Formulario para crear proyectos -->
 <div sec:authorize="hasAnyRole('ADMIN','COLABORADOR')">
    <h3>Nuevo Proyecto</h3>
<form th:action="@{/proyectos/guardar}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <input type="text" name="nombre" placeholder="Nombre del proyecto" required />
    <input type="text" name="descripcion" placeholder="Descripción" />
    <input type="date" name="fechaInicio" />
    <button type="submit">Guardar</button>
</form>
</div>
 <br><br>

<form th:action="@{/logout}" method="post">
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}" />
    <button type="submit">Cerrar sesión</button>
</form>
</body>
</html>
