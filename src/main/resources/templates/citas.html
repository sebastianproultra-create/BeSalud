<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Citas - BeSalud</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/citas.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header-brand}"></header>
<nav th:replace="~{fragments/layout :: nav-admin}"></nav>

<div class="container">
    <div class="card">
        <h2>Citas Médicas</h2>
        <!-- Solo el administrador puede crear citas desde esta vista -->
        <a th:href="@{/citas/crear}" class="btn btn-success" style="margin-bottom: 20px;"
           sec:authorize="hasRole('ADMIN')">+ Agendar Nueva Cita</a>
        
        <table th:if="${!citas.isEmpty()}">
            <thead>
                <tr>
                    <th>Doctor</th>
                    <th>Paciente</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Motivo</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${citas}">
                    <td th:text="${doctoresMap != null and doctoresMap[c.doctorId] != null ? doctoresMap[c.doctorId] : c.doctorId}"></td>
                    <td th:text="${pacientesMap != null and pacientesMap[c.pacienteId] != null ? pacientesMap[c.pacienteId] : c.pacienteId}"></td>
                    <td th:text="${c.fecha != null ? #temporals.format(c.fecha, 'dd/MM/yyyy') : '—'}"></td>
                    <td th:text="${c.hora != null ? #temporals.format(c.hora, 'HH:mm') : '—'}"></td>
                    <td th:text="${c.motivo}"></td>
                    <td>
                        <span th:if="${c.estado != null}" class="badge"
                              th:text="${c.estado.descripcion}"
                              th:class="${'badge ' + (c.estado.name() == 'PENDIENTE' ? 'badge-pending' : c.estado.name() == 'COMPLETADA' ? 'badge-success' : 'badge-cancelled')}"></span>
                        <span th:if="${c.estado == null}" class="badge">—</span>
                    </td>
                    <td>
                        <!-- Solo pacientes y administradores pueden cancelar citas -->
                        <form th:action="@{/citas/{id}/cancelar(id=${c.id})}" method="post" style="display:inline;"
                              sec:authorize="hasRole('PACIENTE') or hasRole('ADMIN')">

                            <button type="submit" class="btn btn-danger" th:if="${c.estado.name() == 'PENDIENTE'}">Cancelar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <div th:if="${citas.isEmpty()}" class="alert alert-info">
            No hay citas registradas
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/form-submit.js}"></script>
</body>
</html>
