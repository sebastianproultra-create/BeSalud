<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acceso denegado - BeSalud</title>
    <link rel="stylesheet" th:href="@{/css/base/global.css}" />
    <th:block th:replace="~{fragments/layout :: design-system}"></th:block>
    <link rel="stylesheet" th:href="@{/css/base/tema-oscuro.css}">
    <script th:src="@{/js/tema.js}"></script>
</head>
<body>
<header th:replace="~{fragments/navbar :: navbar}"></header>

<div class="container">
    <div class="card card-center text-center">
        <h2>Acceso no permitido</h2>
        <p class="mb-20">
            No tienes permiso para ver esta sección. Si crees que esto es un error, contacta al administrador.
        </p>

        <div>
            <a th:href="@{/}" class="btn btn-primary">Volver al inicio</a>
            <a href="javascript:history.back()" class="btn btn-link">Regresar</a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: app-footer}"></footer>
</body>
</html>
