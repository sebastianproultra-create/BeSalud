<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citas - BeSalud</title>
    <link rel="stylesheet" th:href="@{/css/base/global.css}">
    <link rel="stylesheet" th:href="@{/css/base/panel.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>
<body class="doc-page admin-page">
<header th:replace="~{fragments/layout :: shell-admin('citas')}"></header>

<main class="doc-main">
    <section class="doc-hero" aria-labelledby="page-title">
        <div class="doc-hero-glow doc-hero-glow--a" aria-hidden="true"></div>
        <div class="doc-hero-glow doc-hero-glow--b" aria-hidden="true"></div>
        <div class="doc-hero-top">
            <div class="doc-hero-text">
                <p class="doc-eyebrow"><span class="doc-pulse" aria-hidden="true"></span>Agenda</p>
                <h1 id="page-title" class="doc-hero-title">Citas <em>médicas</em></h1>
                <p class="doc-hero-sub">Todas las citas agendadas en la red BeSalud.</p>
            </div>
            <div class="doc-hero-actions">
                <a th:href="@{/citas/crear}" class="doc-btn doc-btn--amber" sec:authorize="hasRole('ADMIN')"><span class="material-symbols-outlined" aria-hidden="true">calendar_add_on</span>Agendar cita</a>
            </div>
        </div>
    </section>

    <div class="doc-card table-card">
        <div class="table-scroll" th:if="${!citas.isEmpty()}">
        <table>
            <thead>
                <tr>
                    <th scope="col">Fecha</th>
                    <th scope="col">Hora</th>
                    <th scope="col">Doctor</th>
                    <th scope="col">Paciente</th>
                    <th scope="col">Motivo</th>
                    <th scope="col">Estado</th>
                    <th scope="col" class="table-actions">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${citas.content}">
                    <td class="td-nowrap" th:text="${c.fecha != null ? #temporals.format(c.fecha, 'dd/MM/yyyy') : '—'}"></td>
                    <td class="td-nowrap" th:text="${c.hora != null ? #temporals.format(c.hora, 'HH:mm') : '—'}"></td>
                    <td th:text="${doctoresMap != null and doctoresMap[c.doctorId] != null ? doctoresMap[c.doctorId] : c.doctorId}"></td>
                    <td th:text="${pacientesMap != null and pacientesMap[c.pacienteId] != null ? pacientesMap[c.pacienteId] : c.pacienteId}"></td>
                    <td th:text="${c.motivo}"></td>
                    <td>
                        <span th:if="${c.estado != null}"
                              th:text="${c.estado.descripcion}"
                              th:class="${'estado-badge ' + (c.estado.name() == 'PENDIENTE' ? 'estado-pendiente' : c.estado.name() == 'ASISTIO' ? 'estado-asistio' : c.estado.name() == 'COMPLETADA' ? 'estado-completada' : c.estado.name() == 'NO_ASISTIO' ? 'estado-no-asistio' : 'estado-cancelada')}"></span>
                        <span th:if="${c.estado == null}" class="estado-badge estado-cancelada">—</span>
                    </td>
                    <td class="table-actions">
                        <!-- Solo pacientes y administradores pueden cancelar citas -->
                        <form th:action="@{/citas/{id}/cancelar(id=${c.id})}" method="post" class="form-inline"
                              sec:authorize="hasRole('PACIENTE') or hasRole('ADMIN')">

                            <button type="submit" class="btn btn-danger btn-sm" th:if="${c.estado != null and c.estado.name() == 'PENDIENTE'}">Cancelar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>

        <p th:if="${citas.isEmpty()}" class="empty-note">No hay citas registradas.</p>
        <nav th:replace="~{fragments/layout :: paginationQ(${citas}, '/citas', ${queryCitas}, 'page')}"></nav>
    </div>
</main>

<footer th:replace="~{fragments/layout :: app-footer}"></footer>
<script th:src="@{/js/form-submit.js}"></script>
</body>
</html>
