<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<th:block th:fragment="design-system">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/logo/icono-32.png(v=1)}">
    <link rel="icon" type="image/png" sizes="192x192" th:href="@{/images/logo/icono-192.png(v=1)}">
    <link rel="apple-touch-icon" th:href="@{/images/logo/icono-180.png(v=1)}">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <script th:src="@{/js/navbar.js}" defer></script>
</th:block>

<!-- ── Paginación reutilizable (page: Page, url: ruta base, search y especialidad: filtros o null) ── -->
<nav th:fragment="pagination(page, url, search, especialidad)" th:if="${page.totalPages > 1}" class="pagination" aria-label="Paginación"
     th:with="start=${(page.number - 2 < 0) ? 0 : (page.number - 2)}, end=${(page.number + 2 >= page.totalPages) ? (page.totalPages - 1) : (page.number + 2)}">
    <a th:if="${page.hasPrevious()}" th:href="@{${url}(page=${page.number - 1}, size=${page.size}, search=${search}, especialidad=${especialidad})}" class="pagination-step">Anterior</a>
    <a th:each="i : ${#numbers.sequence(start, end)}"
       th:href="@{${url}(page=${i}, size=${page.size}, search=${search}, especialidad=${especialidad})}"
       th:text="${i + 1}" th:classappend="${i == page.number} ? 'is-current'" class="pagination-page"
       th:aria-current="${i == page.number} ? 'page'"></a>
    <a th:if="${page.hasNext()}" th:href="@{${url}(page=${page.number + 1}, size=${page.size}, search=${search}, especialidad=${especialidad})}" class="pagination-step">Siguiente</a>
</nav>

<!-- ── Paginación con parámetro propio (query: resto de parámetros ya codificados, pageParam: nombre del parámetro de página) ── -->
<nav th:fragment="paginationQ(page, url, query, pageParam)" th:if="${page.totalPages > 1}" class="pagination" aria-label="Paginación"
     th:with="start=${(page.number - 2 < 0) ? 0 : (page.number - 2)}, end=${(page.number + 2 >= page.totalPages) ? (page.totalPages - 1) : (page.number + 2)}">
    <a th:if="${page.hasPrevious()}" th:href="@{${url + '?' + query + '&' + pageParam + '=' + (page.number - 1)}}" class="pagination-step">Anterior</a>
    <a th:each="i : ${#numbers.sequence(start, end)}"
       th:href="@{${url + '?' + query + '&' + pageParam + '=' + i}}"
       th:text="${i + 1}" th:classappend="${i == page.number} ? 'is-current'" class="pagination-page"
       th:aria-current="${i == page.number} ? 'page'"></a>
    <a th:if="${page.hasNext()}" th:href="@{${url + '?' + query + '&' + pageParam + '=' + (page.number + 1)}}" class="pagination-step">Siguiente</a>
</nav>

<!-- ── Paginación que vuelve a una sección de la página (base: ruta con "?" y parámetros terminados en "&", clave: nombre del parámetro de página, ancla: id de la sección) ── -->
<nav th:fragment="paginacionAncla(page, base, clave, ancla)" th:if="${page != null and page.totalPages > 1}" class="pagination" aria-label="Paginación"
     th:with="actual=${page.number}, ultima=${page.totalPages - 1}, start=${(page.number - 2 < 0) ? 0 : (page.number - 2)}, end=${(page.number + 2 > page.totalPages - 1) ? (page.totalPages - 1) : (page.number + 2)}">
    <a th:if="${page.hasPrevious()}" th:href="@{${base + clave + '=' + (actual - 1) + '#' + ancla}}" class="pagination-step">Anterior</a>
    <a th:if="${start > 0}" th:href="@{${base + clave + '=0#' + ancla}}" class="pagination-page">1</a>
    <span th:if="${start > 1}" class="pagination-dots">…</span>
    <a th:each="i : ${#numbers.sequence(start, end)}"
       th:href="@{${base + clave + '=' + i + '#' + ancla}}"
       th:text="${i + 1}" th:classappend="${i == actual} ? 'is-current'" class="pagination-page"
       th:aria-current="${i == actual} ? 'page'"></a>
    <span th:if="${end < ultima - 1}" class="pagination-dots">…</span>
    <a th:if="${end < ultima}" th:href="@{${base + clave + '=' + ultima + '#' + ancla}}" class="pagination-page" th:text="${ultima + 1}"></a>
    <a th:if="${page.hasNext()}" th:href="@{${base + clave + '=' + (actual + 1) + '#' + ancla}}" class="pagination-step">Siguiente</a>
</nav>

<!-- ── Opciones de especialidad (dentro de un select con th:field) ── -->
<th:block th:fragment="especialidadOpciones">
    <optgroup th:each="g : ${gruposEspecialidad}" th:label="${g.key}">
        <option th:each="e : ${g.value}" th:value="${e}" th:text="${e}"></option>
    </optgroup>
</th:block>

<!-- ── Opciones de especialidad con una preseleccionada ── -->
<th:block th:fragment="especialidadOpcionesSel(seleccionada)">
    <optgroup th:each="g : ${gruposEspecialidad}" th:label="${g.key}">
        <option th:each="e : ${g.value}" th:value="${e}" th:text="${e}" th:selected="${e == seleccionada}"></option>
    </optgroup>
</th:block>

<!-- ── Footer de la app. Se llama app-footer y no footer: el selector ":: footer" también
     toma cualquier <footer> del archivo y la página saldría con dos pies. ── -->
<footer th:fragment="app-footer" class="bs-footer">
    <p>&copy; 2026 BeSalud - Sistema de citas médicas. Todos los derechos reservados. · <a th:href="@{/privacidad}">Política de privacidad</a></p>
</footer>

<footer th:fragment="auth-footer" class="bs-footer" role="contentinfo">
    <p>&copy; 2026 BeSalud · Sistema de Gestión de Citas Médicas · Privacidad y Seguridad · <a th:href="@{/privacidad}">Política de privacidad</a></p>
</footer>

</html>
