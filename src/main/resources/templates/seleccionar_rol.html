<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Seleccionar Rol - BeSalud</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header-brand}"></header>
<div class="container">
    <div class="card" style="max-width: 520px; margin: 50px auto; text-align:center;">
        <h2>Selecciona tu modo de acceso</h2>
        <p>El correo que usas está registrado como médico y paciente.</p>

        <form th:action="@{/seleccionar-rol}" method="post" style="display:flex; flex-direction:column; gap: 15px; margin-top: 30px;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" name="rol" value="ROLE_PACIENTE" class="btn btn-primary">Ingresar como Paciente</button>
            <button type="submit" name="rol" value="ROLE_DOCTOR" class="btn btn-secondary">Ingresar como Doctor</button>
        </form>

        <div style="margin-top: 22px; color: #555; font-size: 0.95rem;">
            Si eliges paciente, no podrás agendar citas contigo mismo y el doctor con tu mismo correo se ocultará del listado.
        </div>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
