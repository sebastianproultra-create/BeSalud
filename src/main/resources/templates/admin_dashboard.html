<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Panel de Administración - BeSalud</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/admin_dashboard.css}">
</head>
<body>
<header>
    <div class="header-brand">
        <h1>BeSalud</h1>
        <p>Panel de Administración</p>
    </div>
    <nav>
        <form th:action="@{/logout}" method="post" style="display: inline;">

            <button type="submit" class="btn btn-secondary">Cerrar Sesión</button>
        </form>
    </nav>
</header>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Doctores</h3>
            <div class="stat-number" th:text="${#lists.size(doctores)}"></div>
        </div>
        <div class="stat-card">
            <h3>Total Pacientes</h3>
            <div class="stat-number" th:text="${#lists.size(pacientes)}"></div>
        </div>
        <div class="stat-card">
            <h3>Total Administradores</h3>
            <div class="stat-number" th:text="${#lists.size(admins)}"></div>
        </div>
    </div>

    <div class="card">
        <h2>Doctores Registrados</h2>
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Especialidad</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                    <tr th:each="doctor : ${doctores.content}">
                        <td th:text="${doctor.nombre + ' ' + doctor.apellido}"></td>
                        <td th:text="${doctor.email}"></td>
                        <td th:text="${doctor.especialidad}"></td>
                        <td>
                            <span th:if="${doctor.estado == 'ACTIVO'}" class="status-badge status-activo">Activo</span>
                            <span th:if="${doctor.estado == 'INACTIVO'}" class="status-badge status-inactivo">Inactivo</span>
                        </td>
                        <td>
                            <a th:href="@{/doctores/{id}/horarios(id=${doctor.id})}" class="btn btn-sm">Ver Horarios</a>
                            <form th:if="${doctor.estado == 'INACTIVO'}" th:action="@{/admin/doctores/{id}/activar(id=${doctor.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-success">Activar</button>
                            </form>
                            <form th:if="${doctor.estado == 'ACTIVO'}" th:action="@{/admin/doctores/{id}/desactivar(id=${doctor.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-warning">Desactivar</button>
                            </form>
                        </td>
                    </tr>
            </tbody>
        </table>
            <form th:action="@{/admin}" method="get" style="display:flex; gap:8px; align-items:center; margin-bottom:12px;">
                <input type="text" name="search" th:value="${search}" placeholder="Buscar por nombre o email" style="padding:8px;" />
                <input type="text" name="especialidad" th:value="${especialidad}" placeholder="Filtrar por especialidad" style="padding:8px;" />
                <input type="hidden" name="size" th:value="${size}" />
                <button type="submit" class="btn btn-primary">Buscar</button>
            </form>
            <div th:if="${doctores.totalPages > 1}" style="margin-top:12px; text-align:center;">
                <a th:if="${doctores.hasPrevious()}" th:href="@{/admin(page=${doctores.number-1},size=${size},search=${search},especialidad=${especialidad})}" class="btn btn-link">Anterior</a>
                <span th:each="i : ${#numbers.sequence(0, doctores.totalPages-1)}">
                    <a th:href="@{/admin(page=${i},size=${size},search=${search},especialidad=${especialidad})}"
                       th:text="${i+1}"
                       th:classappend="${i == doctores.number} ? ' btn btn-accent' : ' btn btn-link'"
                       style="margin:0 4px;"></a>
                </span>
                <a th:if="${doctores.hasNext()}" th:href="@{/admin(page=${doctores.number+1},size=${size},search=${search},especialidad=${especialidad})}" class="btn btn-link">Siguiente</a>
            </div>
    </div>

    <div class="card">
        <h2>Pacientes Registrados</h2>
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="paciente : ${pacientes.content}">
                    <td th:text="${paciente.nombre + ' ' + paciente.apellido}"></td>
                    <td th:text="${paciente.email}"></td>
                    <td th:text="${paciente.telefono}"></td>
                    <td>
                        <a th:href="@{/citas?pacienteId={id}(id=${paciente.id})}" class="btn btn-sm">Ver Citas</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <div th:if="${pacientes.totalPages > 1}" style="margin-top:12px; text-align:center;">
            <a th:if="${pacientes.hasPrevious()}" th:href="@{/admin(page=${pacientes.number-1},size=${size})}" class="btn btn-link">Anterior</a>
            <span th:each="i : ${#numbers.sequence(0, pacientes.totalPages-1)}">
                <a th:href="@{/admin(page=${i},size=${size})}"
                   th:text="${i+1}"
                   th:classappend="${i == pacientes.number} ? ' btn btn-accent' : ' btn btn-link'"
                   style="margin:0 4px;"></a>
            </span>
            <a th:if="${pacientes.hasNext()}" th:href="@{/admin(page=${pacientes.number+1},size=${size})}" class="btn btn-link">Siguiente</a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
