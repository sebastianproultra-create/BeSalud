<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - BeSalud</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/admin_dashboard.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: shell-admin('panel')}"></header>

<main class="container">
    <section class="page-header" aria-labelledby="page-title">
        <div>
            <p class="page-eyebrow">Panel de administración</p>
            <h1 id="page-title" class="page-title">Resumen general</h1>
        </div>
    </section>

    <div class="stats-grid">
        <div class="stat-card">
            <h2>Total doctores</h2>
            <div class="stat-number" th:text="${totalDoctores}"></div>
        </div>
        <div class="stat-card">
            <h2>Total pacientes</h2>
            <div class="stat-number" th:text="${totalPacientes}"></div>
        </div>
        <div class="stat-card">
            <h2>Total administradores</h2>
            <div class="stat-number" th:text="${#lists.size(admins)}"></div>
        </div>
    </div>

    <div class="card">
        <h2>Doctores registrados</h2>
        <form th:action="@{/admin}" method="get" class="toolbar" role="search">
            <label for="search" class="visually-hidden">Buscar por nombre o email</label>
            <input id="search" type="text" name="search" th:value="${search}" placeholder="Buscar nombre o email"/>
            <label for="especialidad" class="visually-hidden">Especialidad</label>
            <input id="especialidad" type="text" name="especialidad" th:value="${especialidad}" placeholder="Filtrar especialidad"/>
            <input type="hidden" name="size" th:value="${size}" />
            <div class="toolbar-actions">
                <button type="submit" class="btn btn-primary">Buscar</button>
                <a th:if="${(search != null and !search.isEmpty()) or (especialidad != null and !especialidad.isEmpty())}"
                   th:href="@{/admin}" class="btn btn-secondary">Limpiar</a>
            </div>
        </form>
        <div class="table-scroll">
        <table>
            <thead>
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Email</th>
                    <th scope="col">Especialidad</th>
                    <th scope="col">Estado</th>
                    <th scope="col" class="table-actions">Acciones</th>
                </tr>
            </thead>
            <tbody>
                    <tr th:each="doctor : ${doctores.content}">
                        <td th:text="${doctor.nombre + ' ' + doctor.apellido}"></td>
                        <td th:text="${doctor.email}"></td>
                        <td th:text="${doctor.especialidad}"></td>
                        <td>
                            <span th:if="${doctor.estado == 'ACTIVO'}" class="status-badge status-activo">Activo</span>
                            <span th:if="${doctor.estado == 'INACTIVO'}" class="status-badge status-inactivo">Inactivo</span>
                        </td>
                        <td class="table-actions">
                            <a th:href="@{/doctores/{id}/horarios(id=${doctor.id})}" class="btn btn-secondary btn-sm">Ver horarios</a>
                            <form th:if="${doctor.estado == 'INACTIVO'}" th:action="@{/admin/doctores/{id}/activar(id=${doctor.id})}" method="post" class="form-inline">
                                <button type="submit" class="btn btn-sm btn-success">Activar</button>
                            </form>
                            <form th:if="${doctor.estado == 'ACTIVO'}" th:action="@{/admin/doctores/{id}/desactivar(id=${doctor.id})}" method="post" class="form-inline">
                                <button type="submit" class="btn btn-sm btn-warning">Desactivar</button>
                            </form>
                        </td>
                    </tr>
            </tbody>
        </table>
        </div>
        <nav th:replace="~{fragments/layout :: paginationQ(${doctores}, '/admin', ${queryDoctores}, 'pageDoctores')}"></nav>
    </div>

    <div class="card">
        <h2>Pacientes registrados</h2>
        <div class="table-scroll">
        <table>
            <thead>
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Email</th>
                    <th scope="col">Teléfono</th>
                    <th scope="col" class="table-actions">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="paciente : ${pacientes.content}">
                    <td th:text="${paciente.nombre + ' ' + paciente.apellido}"></td>
                    <td th:text="${paciente.email}"></td>
                    <td th:text="${paciente.telefono}"></td>
                    <td class="table-actions">
                        <a th:href="@{/citas?pacienteId={id}(id=${paciente.id})}" class="btn btn-secondary btn-sm">Ver citas</a>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
        <nav th:replace="~{fragments/layout :: paginationQ(${pacientes}, '/admin', ${queryPacientes}, 'pagePacientes')}"></nav>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
